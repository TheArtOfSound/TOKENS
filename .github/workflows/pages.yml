name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (immutable)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (normalization, privacy, schema, strangler)
        run: npm test
      - name: Validate published data (schema + hash + secret scan)
        run: npm run validate:data
      - name: Dependency audit (blocking)
        # Must be able to fail the build. A `|| true` here makes the gate decorative.
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
