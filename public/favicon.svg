<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ledger">
  <!--
    The mark: ledger rows resolving into a verification check.

    Replaces a generic gradient orb that said nothing about the product. This is
    literal — rows of a record, plus a check meaning the record was verified —
    and it survives 16px because the check dominates the silhouette.

    Deliberately built from plain filled polygons with NO strokes and NO nested
    transforms. Both are unevenly supported by rasterisers (ImageMagick's built-in
    SVG renderer drops stroked paths and mis-places nested transforms), and either
    would silently ship a broken logo in every generated PNG. The check outline is
    therefore precomputed: vertex (32,44), arms to (23,35) and (50,22), offset by
    half-thickness along each arm's perpendicular.

    The check is drawn twice — a thicker dark keyline, then the green — so it
    stays readable where it crosses the third row.
  -->
  <rect width="64" height="64" rx="15" fill="#0d1220"/>

  <!-- Ledger rows -->
  <rect x="11" y="17" width="19" height="4.5" rx="2.25" fill="#8593ad"/>
  <rect x="11" y="28" width="12" height="4.5" rx="2.25" fill="#66738d"/>
  <rect x="11" y="39" width="16" height="4.5" rx="2.25" fill="#4d5a73"/>

  <!-- Dark keyline (half-thickness 6) -->
  <path d="M45.4,18.2 L54.6,25.8 L32.4,52.9 L18.8,39.2 L27.2,30.8 L31.6,35.1 Z" fill="#0d1220"/>
  <!-- Verification check (half-thickness 3.5) -->
  <path d="M47.3,19.8 L52.7,24.2 L32.3,49.2 L20.5,37.5 L25.5,32.5 L31.7,38.8 Z" fill="#22c55e"/>
</svg>
