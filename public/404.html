<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QIRA — redirecting…</title>
    <!--
      GitHub Pages has no server-side rewrite, so a hard load of a clean URL like
      /people would 404. This redirects it to /?/people (a real 200 at the root);
      index.html then restores the clean path before the app boots. Result: clean
      URLs that hard-load with a 200 status. Standard spa-github-pages technique.
    -->
    <script>
      (function () {
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.host + '/?/' +
            l.pathname.slice(1).replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body>
    <p>Redirecting… If nothing happens, <a href="/">go to the homepage</a>.</p>
  </body>
</html>
